<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Arquitectura del Sistema - Mesa de Ayuda Comunicarlos</title>
  <desc id="archDesc">Diagrama de arquitectura del sistema por capas: Clientes Web y Desktop, API Gateway FastAPI, Seguridad JWT, Dominio DDD-lite con Patrones Factory y Observer, y Persistencia MongoDB 7.</desc>
  <defs>
    <!-- Arrow Marker Cyan -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#00E5FF"/>
    </marker>
    <!-- Arrow Marker Amber -->
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#FFC857"/>
    </marker>
    <!-- Arrow Marker Purple -->
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#BD93F9"/>
    </marker>
    <!-- Arrow Marker Green -->
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#00FF9C"/>
    </marker>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace; }
    .bg { fill: #0B0F14; }
    .canvas-border { fill: none; stroke: #1C2A38; stroke-width: 1.5; rx: 12px; }
    .header-title { font-size: 20px; font-weight: 800; fill: #FFFFFF; letter-spacing: 2px; }
    .header-sub { font-size: 11.5px; fill: #00E5FF; font-weight: 600; letter-spacing: 1.2px; }
    
    /* Box styles */
    .box-client { fill: #0F1722; stroke: #00E5FF; stroke-width: 1.5; rx: 8px; }
    .box-gateway { fill: #131A26; stroke: #2E4560; stroke-width: 1.5; rx: 8px; }
    .box-auth { fill: #1C131A; stroke: #FF4D6D; stroke-width: 1.5; rx: 6px; }
    .box-domain { fill: #18191D; stroke: #FFC857; stroke-width: 1.5; rx: 8px; }
    .box-subdomain { fill: #11141A; stroke: #3D3520; stroke-width: 1; rx: 6px; }
    .box-events { fill: #161222; stroke: #BD93F9; stroke-width: 1.5; rx: 8px; }
    .box-infra { fill: #0E1A17; stroke: #00FF9C; stroke-width: 1.5; rx: 8px; }
    
    /* Texts inside boxes */
    .txt-title-cyan { font-size: 13.5px; font-weight: 700; fill: #00E5FF; }
    .txt-title-amber { font-size: 13.5px; font-weight: 700; fill: #FFC857; }
    .txt-title-purple { font-size: 13.5px; font-weight: 700; fill: #BD93F9; }
    .txt-title-green { font-size: 13.5px; font-weight: 700; fill: #00FF9C; }
    .txt-title-red { font-size: 12.5px; font-weight: 700; fill: #FF4D6D; }
    
    .txt-desc { font-size: 10.5px; fill: #8B98A5; }
    .txt-desc-dim { font-size: 9.5px; fill: #5A6978; }
    .txt-code { font-size: 10px; fill: #E6EDF3; font-weight: 600; }
    .txt-badge { font-size: 9px; font-weight: 700; }
    
    /* Connectors */
    .conn-cyan { stroke: #00E5FF; stroke-width: 1.5; fill: none; marker-end: url(#arrowCyan); }
    .conn-amber { stroke: #FFC857; stroke-width: 1.5; fill: none; marker-end: url(#arrowAmber); }
    .conn-purple { stroke: #BD93F9; stroke-width: 1.5; fill: none; marker-end: url(#arrowPurple); }
    .conn-green { stroke: #00FF9C; stroke-width: 1.5; fill: none; marker-end: url(#arrowGreen); }
    .conn-dashed { stroke-dasharray: 4 3; }
  </style>

  <!-- Canvas Background -->
  <rect width="960" height="700" class="bg"/>
  <rect x="12" y="12" width="936" height="676" class="canvas-border"/>

  <!-- Top Title Header -->
  <g transform="translate(36, 42)">
    <text x="0" y="0" class="mono header-title">COMUNICARLOS · SISTEMA DE MESA DE AYUDA</text>
    <text x="0" y="20" class="mono header-sub">ARQUITECTURA DE SOFTWARE · DDD-LITE · OBSERVER PATTERN · REPOSITORY</text>
  </g>

  <!-- ========================================== -->
  <!-- LAYER 1: CLIENTS (PRESENTATION)             -->
  <!-- ========================================== -->
  <!-- Web Portal -->
  <g transform="translate(36, 85)">
    <rect width="420" height="70" class="box-client"/>
    <text x="18" y="26" class="mono txt-title-cyan">🌐 PORTAL WEB (web/)</text>
    <text x="18" y="44" class="mono txt-desc">HTML5 · Vanilla CSS3 (Responsive) · Vanilla JS (fetch)</text>
    <text x="18" y="58" class="mono txt-desc-dim">Servido como archivos estáticos por FastAPI · Sin frameworks ni build step</text>
  </g>

  <!-- Desktop Client -->
  <g transform="translate(504, 85)">
    <rect width="420" height="70" class="box-client"/>
    <text x="18" y="26" class="mono txt-title-cyan">🖥️ CLIENTE ESCRITORIO (desktop/)</text>
    <text x="18" y="44" class="mono txt-desc">PyQt6 · httpx · DTOs propios independientes</text>
    <text x="18" y="58" class="mono txt-desc-dim">ClienteApi (ABC): ApiClienteHttp (Producción) / ApiClienteDemo (Demo)</text>
  </g>

  <!-- Connection: Clients to API Gateway -->
  <path d="M 246 155 L 246 195 L 430 195" class="conn-cyan"/>
  <path d="M 714 155 L 714 195 L 530 195" class="conn-cyan"/>
  <text x="480" y="190" text-anchor="middle" class="mono txt-desc" fill="#00E5FF">HTTP / JSON (REST API)</text>

  <!-- ========================================== -->
  <!-- LAYER 2: API GATEWAY & SECURITY             -->
  <!-- ========================================== -->
  <g transform="translate(36, 215)">
    <rect width="888" height="68" class="box-gateway"/>
    <text x="20" y="26" class="mono txt-code" fill="#FFFFFF">⚙️ API REST · FastAPI (app/main.py)</text>
    <text x="20" y="44" class="mono txt-desc">Inyección de Dependencias (deps.py) · Documentación OpenAPI (/docs) · Validaciones Pydantic v2</text>
    
    <!-- Auth Guard Mini-Box inside Gateway -->
    <g transform="translate(480, 10)">
      <rect width="390" height="48" class="box-auth"/>
      <text x="14" y="20" class="mono txt-title-red">🔐 AUTH GUARD (app/auth.py)</text>
      <text x="14" y="36" class="mono txt-desc">JWT Bearer (python-jose) + bcrypt · RBAC: 4 Roles estrictos</text>
    </g>
  </g>

  <!-- Connection: Gateway to Domain & Supervision -->
  <path d="M 480 283 L 480 320" class="conn-amber"/>

  <!-- ========================================== -->
  <!-- LAYER 3: DOMAIN & APPLICATION (DDD-LITE)   -->
  <!-- ========================================== -->
  <g transform="translate(36, 325)">
    <rect width="888" height="155" class="box-domain"/>
    <text x="20" y="24" class="mono txt-title-amber">🏛️ NÚCLEO DE DOMINIO Y APLICACIÓN (app/requerimientos/ &amp; app/usuarios/)</text>

    <!-- Sub-box: Fábrica Polimórfica -->
    <g transform="translate(18, 40)">
      <rect width="250" height="100" class="box-subdomain"/>
      <text x="14" y="22" class="mono txt-code" fill="#FFC857">FabricaRequerimientos</text>
      <text x="14" y="36" class="mono txt-desc-dim">Patrón: Factory Method</text>
      <line x1="14" y1="44" x2="236" y2="44" stroke="#2D2518"/>
      <text x="14" y="60" class="mono txt-code" fill="#00FF9C">► Incidente (Falla técnica)</text>
      <text x="14" y="74" class="mono txt-desc-dim">SLA + Prioridad + Detección</text>
      <text x="14" y="90" class="mono txt-code" fill="#00E5FF">► Solicitud (Administrativa)</text>
    </g>

    <!-- Sub-box: Information Expert & Máquina de Estados -->
    <g transform="translate(282, 40)">
      <rect width="350" height="100" class="box-subdomain"/>
      <text x="14" y="22" class="mono txt-code" fill="#FFC857">Requerimiento (Information Expert)</text>
      <text x="14" y="38" class="mono txt-desc">ABIERTO ➔ EN_ANALISIS ➔ EN_PROGRESO ➔ RESUELTO ➔ CERRADO</text>
      <line x1="14" y1="46" x2="336" y2="46" stroke="#2D2518"/>
      <text x="14" y="62" class="mono txt-desc">✓ Comentario en RESUELTO ➔ Reapertura automática</text>
      <text x="14" y="78" class="mono txt-desc">✓ Interconsulta / Derivación entre Técnicos</text>
      <text x="14" y="93" class="mono txt-desc">✓ Cierre de conformidad por Solicitante / Operador</text>
    </g>

    <!-- Sub-box: Usuarios y Supervisión -->
    <g transform="translate(646, 40)">
      <rect width="224" height="100" class="box-subdomain"/>
      <text x="14" y="22" class="mono txt-code" fill="#FFC857">Usuarios &amp; Supervisión</text>
      <text x="14" y="36" class="mono txt-desc-dim">Aggregate Root &amp; Relaciones</text>
      <line x1="14" y1="44" x2="210" y2="44" stroke="#2D2518"/>
      <text x="14" y="60" class="mono txt-desc">✓ Matriz de 4 Roles</text>
      <text x="14" y="75" class="mono txt-desc">✓ Validación de Contratos</text>
      <text x="14" y="90" class="mono txt-desc">✓ Supervisión N:M</text>
    </g>
  </g>

  <!-- Two paths from Domain: to Observer (Left) and to Persistence (Right) -->
  <path d="M 246 480 L 246 515" class="conn-purple"/>
  <path d="M 680 480 L 680 515" class="conn-green"/>

  <!-- ========================================== -->
  <!-- LAYER 4: OBSERVER & PERSISTENCE            -->
  <!-- ========================================== -->
  <!-- Observer Bus Box (Left) -->
  <g transform="translate(36, 520)">
    <rect width="420" height="95" class="box-events"/>
    <text x="18" y="24" class="mono txt-title-purple">📢 DESPACHADOR DE EVENTOS (Observer)</text>
    <text x="18" y="42" class="mono txt-desc">Desacoplamiento de eventos de dominio (app/notificaciones/)</text>
    <line x1="18" y1="50" x2="400" y2="50" stroke="#2A223B"/>
    <text x="18" y="68" class="mono txt-code" fill="#E6EDF3">► ObservadorLogger:</text>
    <text x="175" y="68" class="mono txt-desc">Auditoría estructurada</text>
    <text x="18" y="84" class="mono txt-code" fill="#BD93F9">► ObservadorNotificacionesMongo:</text>
    <text x="260" y="84" class="mono txt-desc">Alertas a Jefatura</text>
  </g>

  <!-- Persistence & Repositories Box (Right) -->
  <g transform="translate(480, 520)">
    <rect width="444" height="95" class="box-infra"/>
    <text x="18" y="24" class="mono txt-title-green">🗄️ PERSISTENCIA &amp; REPOSITORIOS (app/infraestructura/)</text>
    <text x="18" y="42" class="mono txt-desc">Puertos Abstractos (Repository) ➔ Adaptadores PyMongo</text>
    <line x1="18" y1="50" x2="426" y2="50" stroke="#16382B"/>
    <text x="18" y="68" class="mono txt-code" fill="#00FF9C">MongoDB 7:</text>
    <text x="105" y="68" class="mono txt-desc">usuarios · requerimientos · supervision · notificaciones</text>
    <text x="18" y="84" class="mono txt-code" fill="#00E5FF">Tests (257+):</text>
    <text x="125" y="84" class="mono txt-desc">mongomock &amp; fakes en memoria sin dependencias</text>
  </g>

  <!-- ========================================== -->
  <!-- FOOTER LEGEND                              -->
  <!-- ========================================== -->
  <g transform="translate(36, 642)">
    <rect width="888" height="34" fill="#0E131A" stroke="#1C2733" rx="6"/>
    <text x="16" y="21" class="mono txt-badge" fill="#8B98A5">CÓDIGO DE COLORES:</text>
    
    <circle cx="160" cy="17" r="5" fill="#00E5FF"/>
    <text x="172" y="21" class="mono txt-badge" fill="#00E5FF">Clientes / Presentación</text>

    <circle cx="350" cy="17" r="5" fill="#FF4D6D"/>
    <text x="362" y="21" class="mono txt-badge" fill="#FF4D6D">Seguridad / JWT RBAC</text>

    <circle cx="530" cy="17" r="5" fill="#FFC857"/>
    <text x="542" y="21" class="mono txt-badge" fill="#FFC857">Dominio DDD-lite</text>

    <circle cx="700" cy="17" r="5" fill="#BD93F9"/>
    <text x="712" y="21" class="mono txt-badge" fill="#BD93F9">Observer Event Bus</text>

    <circle cx="850" cy="17" r="5" fill="#00FF9C"/>
    <text x="862" y="21" class="mono txt-badge" fill="#00FF9C">Persistencia</text>
  </g>
</svg>
