<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" role="img" aria-labelledby="title desc">
  <title id="title">Mesa de Ayuda - Cooperativa Comunicarlos</title>
  <desc id="desc">Logo oficial del sistema de Mesa de Ayuda de Cooperativa Comunicarlos, desarrollado para el Proyecto Profesional PP5 - FIE.</desc>
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00FF9C"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#BD93F9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00FF9C" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: #0B0F14; stroke: #1C2A38; stroke-width: 2; rx: 16px; }
    .grid-line { stroke: #15202B; stroke-width: 1; }
    .title-text { font-family: 'JetBrains Mono', 'Consolas', 'Segoe UI', monospace; font-size: 27px; font-weight: 800; fill: #FFFFFF; letter-spacing: 2.5px; }
    .sub-text { font-family: 'JetBrains Mono', 'Consolas', 'Segoe UI', monospace; font-size: 13px; font-weight: 600; fill: #00E5FF; letter-spacing: 1.8px; }
    .desc-text { font-family: 'JetBrains Mono', 'Consolas', 'Segoe UI', monospace; font-size: 11.5px; fill: #8B98A5; letter-spacing: 0.8px; }
    .badge-bg { fill: #101B26; stroke: #1C3347; stroke-width: 1; rx: 4px; }
    .badge-text { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 10px; font-weight: 700; fill: #00FF9C; }
    .node-dot { fill: #00E5FF; }
  </style>

  <!-- Background Card -->
  <rect width="760" height="190" class="bg"/>

  <!-- Subtle Tech Grid Accent -->
  <g opacity="0.4">
    <line x1="140" y1="20" x2="140" y2="170" class="grid-line" />
    <line x1="560" y1="20" x2="560" y2="170" class="grid-line" />
    <line x1="20" y1="95" x2="740" y2="95" class="grid-line" stroke-dasharray="4 4" />
  </g>

  <!-- Emblem / Icon (Left) -->
  <g transform="translate(75, 95)">
    <!-- Hexagonal Outer Tech Ring -->
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="#0E1722" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)"/>
    <polygon points="0,-42 36,-21 36,21 0,42 -36,21 -36,-21" fill="#0B0F14" stroke="#1E2F40" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Network & Support Headset / Ticket Node Motif -->
    <!-- Headset arc -->
    <path d="M-22,6 A22,22 0 0,1 22,6" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
    <!-- Left earcup -->
    <rect x="-27" y="2" width="7" height="14" rx="3" fill="#00FF9C"/>
    <!-- Right earcup & mic -->
    <rect x="20" y="2" width="7" height="14" rx="3" fill="#00FF9C"/>
    <path d="M22,14 A16,16 0 0,1 4,24 L-2,24" fill="none" stroke="#00FF9C" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-3" cy="24" r="2.5" fill="#00E5FF"/>

    <!-- Central Ticket Star / Core Spark -->
    <circle cx="0" cy="-6" r="4.5" fill="#00E5FF" filter="url(#glow)"/>

    <!-- Orbit Dots -->
    <circle cx="0" cy="-52" r="3" class="node-dot"/>
    <circle cx="45" cy="26" r="3" class="node-dot"/>
    <circle cx="-45" cy="26" r="3" class="node-dot"/>
  </g>

  <!-- Divider Line -->
  <line x1="145" y1="35" x2="145" y2="155" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Typography and Badges -->
  <g transform="translate(165, 0)">
    <!-- Main Title -->
    <text x="0" y="62" class="title-text">COMUNICARLOS</text>
    
    <!-- Subtitle -->
    <text x="0" y="88" class="sub-text">MESA DE AYUDA · SISTEMA DE GESTIÓN TÉCNICA</text>
    
    <!-- Academic / Project info -->
    <text x="0" y="112" class="desc-text">Proyecto Profesional (PP5) · Facultad de Informática y Electrónica (FIE)</text>
    <text x="0" y="129" class="desc-text">Arquitectura DDD-lite · 4 Roles RBAC · Observer Pattern · 250+ Tests</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 142)">
      <!-- Badge 1: FASTAPI -->
      <rect x="0" y="0" width="76" height="20" class="badge-bg"/>
      <text x="38" y="14" text-anchor="middle" class="badge-text">FASTAPI</text>

      <!-- Badge 2: PYTHON 3.12 -->
      <rect x="84" y="0" width="98" height="20" class="badge-bg"/>
      <text x="133" y="14" text-anchor="middle" class="badge-text" fill="#00E5FF">PYTHON 3.12</text>

      <!-- Badge 3: MONGODB 7 -->
      <rect x="190" y="0" width="92" height="20" class="badge-bg"/>
      <text x="236" y="14" text-anchor="middle" class="badge-text">MONGODB 7</text>

      <!-- Badge 4: PYQT6 -->
      <rect x="290" y="0" width="62" height="20" class="badge-bg"/>
      <text x="321" y="14" text-anchor="middle" class="badge-text" fill="#BD93F9">PYQT6</text>

      <!-- Badge 5: DOCKER -->
      <rect x="360" y="0" width="68" height="20" class="badge-bg"/>
      <text x="394" y="14" text-anchor="middle" class="badge-text">DOCKER</text>

      <!-- Badge 6: DDD-LITE -->
      <rect x="436" y="0" width="78" height="20" class="badge-bg"/>
      <text x="475" y="14" text-anchor="middle" class="badge-text" fill="#FFC857">DDD-LITE</text>
    </g>
  </g>
</svg>
