[project]
name = "mesa-de-ayuda-comunicarlos"
version = "0.1.0"
description = "Mesa de Ayuda - Cooperativa Comunicarlos - PP5"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "pymongo>=4.7",
    "pyqt6>=6.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "mongomock>=4.1",
    "ruff>=0.16.6",
    "mypy>=2.3.1",
    "types-python-jose>=3.5.0.20260408",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["CONTEXTO inicial"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
