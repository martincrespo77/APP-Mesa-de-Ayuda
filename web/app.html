<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesa de Ayuda — Comunicarlos</title>
    <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
    <div class="contenedor contenedor-ancho">
        <header class="encabezado">
            <div>
                <h1 style="margin-bottom: 2px;">Mesa de Ayuda</h1>
                <p class="subtitulo" style="margin: 0;">Cooperativa Comunicarlos</p>
            </div>
            <div class="usuario-actual">
                <div id="usuario-nombre">Cargando…</div>
                <div id="usuario-rol"></div>
                <button class="secundario" id="boton-salir" style="margin-top: 6px; padding: 4px 12px; font-size: 12px;">
                    Cerrar sesión
                </button>
            </div>
        </header>

        <nav class="pestanas">
            <button class="pestana activa" data-pestana="nuevo">Nuevo requerimiento</button>
            <button class="pestana" data-pestana="listado" id="pestana-boton-listado">Mis requerimientos</button>
            <button class="pestana" data-pestana="notificaciones" id="pestana-boton-notificaciones" hidden>Notificaciones</button>
            <button class="pestana" data-pestana="equipo" id="pestana-boton-equipo" hidden>Equipo supervisado</button>
            <button class="pestana" data-pestana="usuarios" id="pestana-boton-usuarios" hidden>Usuarios</button>
        </nav>

        <!-- Pestaña: Nuevo requerimiento -->
        <section id="pestana-nuevo">
            <div class="tarjeta">
                <h2>Nuevo requerimiento</h2>
                <form id="form-nuevo">
                    <label for="tipo">Tipo</label>
                    <select id="tipo" name="tipo">
                        <option value="INCIDENTE">Incidente (corte o falla de un servicio)</option>
                        <option value="SOLICITUD">Solicitud (pedido planificado / consulta)</option>
                    </select>

                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" required />

                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" required></textarea>

                    <!-- Campos específicos de Incidente -->
                    <div id="campos-incidente">
                        <div class="fila">
                            <div>
                                <label for="urgencia">Urgencia</label>
                                <select id="urgencia">
                                    <option value="MENOR">Menor</option>
                                    <option value="IMPORTANTE">Importante</option>
                                    <option value="CRITICO">Crítico</option>
                                </select>
                            </div>
                            <div>
                                <label for="categoria-incidente">Categoría</label>
                                <select id="categoria-incidente">
                                    <option value="SERVICIO_INACCESIBLE">Servicio inaccesible</option>
                                    <option value="BLOQUEO_SIM">Bloqueo de SIM</option>
                                    <option value="PERDIDA_O_DESTRUCCION_DE_EQUIPO">Pérdida o destrucción de equipo</option>
                                </select>
                            </div>
                        </div>

                        <label for="servicio-incidente">Servicio</label>
                        <select id="servicio-incidente">
                            <option value="TELEFONIA_CELULAR">Telefonía celular</option>
                            <option value="INTERNET_BANDA_ANCHA">Internet de banda ancha</option>
                            <option value="TELEVISION">Televisión</option>
                        </select>

                        <label for="pasos_reproduccion">Pasos para reproducir el problema</label>
                        <textarea id="pasos_reproduccion"></textarea>
                    </div>

                    <!-- Campos específicos de Solicitud -->
                    <div id="campos-solicitud" hidden>
                        <div class="fila">
                            <div>
                                <label for="categoria-solicitud">Categoría</label>
                                <select id="categoria-solicitud">
                                    <option value="ALTA_SERVICIO">Alta de servicio</option>
                                    <option value="BAJA_SERVICIO">Baja de servicio</option>
                                </select>
                            </div>
                            <div>
                                <label for="servicio-solicitud">Servicio</label>
                                <select id="servicio-solicitud">
                                    <option value="TELEFONIA_CELULAR">Telefonía celular</option>
                                    <option value="INTERNET_BANDA_ANCHA">Internet de banda ancha</option>
                                    <option value="TELEVISION">Televisión</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <button type="submit" style="margin-top: 20px;">Crear requerimiento</button>
                    <p class="error" id="error-nuevo" hidden></p>
                    <p class="exito" id="exito-nuevo" hidden></p>
                </form>
            </div>
        </section>

        <!-- Pestaña: Listado -->
        <section id="pestana-listado" hidden>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <h2 style="margin: 0;" id="listado-titulo">Mis requerimientos</h2>
                <button class="secundario" id="boton-refrescar">Refrescar</button>
            </div>

            <!-- Panel Global (Supervisor, Fase 4): métricas básicas -->
            <div class="metricas" id="panel-metricas" hidden>
                <div class="metrica">
                    <span class="metrica-valor" id="metrica-abiertos">0</span>
                    <span class="metrica-etiqueta">Abiertos</span>
                </div>
                <div class="metrica">
                    <span class="metrica-valor" id="metrica-criticos">0</span>
                    <span class="metrica-etiqueta">Críticos</span>
                </div>
                <div class="metrica">
                    <span class="metrica-valor" id="metrica-resueltos">0</span>
                    <span class="metrica-etiqueta">Resueltos</span>
                </div>
            </div>

            <!-- Filtro simple (Solicitante): Todos/Activos/Finalizados -->
            <div class="filtro-estado" id="filtro-estado">
                <button type="button" class="chip activa" data-filtro="todos">Todos</button>
                <button type="button" class="chip" data-filtro="activos">Activos</button>
                <button type="button" class="chip" data-filtro="finalizados">Finalizados</button>
            </div>

            <!-- Vista Técnico: Mis asignaciones (default) / Todos los tickets -->
            <div class="filtro-estado" id="vista-tecnico" hidden>
                <button type="button" class="chip activa" data-vista="mis-asignaciones">Mis asignaciones</button>
                <button type="button" class="chip" data-vista="todos">Todos los tickets</button>
            </div>

            <!-- Filtros avanzados (Operador/Supervisor, y Técnico en "Todos los tickets") -->
            <div class="fila" id="filtros-avanzados" hidden style="margin-bottom: 14px;">
                <div>
                    <label for="filtro-avanzado-estado">Estado</label>
                    <select id="filtro-avanzado-estado">
                        <option value="">Todos</option>
                        <option value="ABIERTO">Abierto</option>
                        <option value="EN_ANALISIS">En análisis</option>
                        <option value="EN_PROGRESO">En progreso</option>
                        <option value="RESUELTO">Resuelto</option>
                        <option value="CERRADO">Cerrado</option>
                        <option value="CANCELADO">Cancelado</option>
                    </select>
                </div>
                <div>
                    <label for="filtro-avanzado-urgencia">Urgencia</label>
                    <select id="filtro-avanzado-urgencia">
                        <option value="">Todas</option>
                        <option value="MENOR">Menor</option>
                        <option value="IMPORTANTE">Importante</option>
                        <option value="CRITICO">Crítico</option>
                    </select>
                </div>
                <div>
                    <label for="filtro-avanzado-servicio">Servicio</label>
                    <select id="filtro-avanzado-servicio">
                        <option value="">Todos</option>
                        <option value="TELEFONIA_CELULAR">Telefonía celular</option>
                        <option value="INTERNET_BANDA_ANCHA">Internet de banda ancha</option>
                        <option value="TELEVISION">Televisión</option>
                    </select>
                </div>
            </div>

            <p class="error" id="error-listado" hidden></p>
            <div class="lista-tickets" id="lista-tickets"></div>
        </section>

        <!-- Pestaña: Notificaciones (Supervisor, Fase 4) -->
        <section id="pestana-notificaciones" hidden>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <h2 style="margin: 0;">Notificaciones</h2>
                <button class="secundario" id="boton-refrescar-notificaciones">Refrescar</button>
            </div>
            <p class="error" id="error-notificaciones" hidden></p>
            <div class="lista-tickets" id="lista-notificaciones"></div>
        </section>

        <!-- Pestaña: Equipo supervisado (Supervisor, Fase 4) -->
        <section id="pestana-equipo" hidden>
            <div class="tarjeta" style="margin-bottom: 16px;">
                <h2>Agregar supervisado</h2>
                <div style="display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 200px;">
                        <label for="select-nuevo-supervisado">Operador o Técnico</label>
                        <select id="select-nuevo-supervisado"></select>
                    </div>
                    <button type="button" id="boton-agregar-supervisado">Agregar</button>
                </div>
                <p class="error" id="error-equipo" hidden></p>
            </div>

            <h2>Mi equipo</h2>
            <div class="lista-tickets" id="lista-equipo"></div>
        </section>

        <!-- Pestaña: Administrar usuarios (Supervisor) -->
        <section id="pestana-usuarios" hidden>
            <div class="tarjeta" style="margin-bottom: 16px;">
                <h2>Crear usuario</h2>
                <form id="form-crear-usuario">
                    <label for="nuevo-usuario-nombre">Nombre completo</label>
                    <input type="text" id="nuevo-usuario-nombre" required />

                    <label for="nuevo-usuario-email">Email</label>
                    <input type="email" id="nuevo-usuario-email" required />
                    <p id="nuevo-usuario-hint-email" class="error" style="color: var(--texto-secundario); margin-top: 4px;" hidden>
                        Este rol requiere un email @comunicarlos.com.ar.
                    </p>

                    <label for="nuevo-usuario-password">Contraseña</label>
                    <input type="password" id="nuevo-usuario-password" required minlength="8" autocomplete="new-password" />

                    <label for="nuevo-usuario-rol">Rol</label>
                    <select id="nuevo-usuario-rol">
                        <option value="SOLICITANTE">Solicitante</option>
                        <option value="OPERADOR">Operador</option>
                        <option value="TECNICO">Técnico</option>
                        <option value="SUPERVISOR">Supervisor</option>
                    </select>

                    <div id="nuevo-usuario-servicios">
                        <label>Servicios contratados</label>
                        <div class="fila-checkboxes">
                            <label class="checkbox">
                                <input type="checkbox" name="nuevo-usuario-servicio" value="TELEFONIA_CELULAR" />
                                Telefonía celular
                            </label>
                            <label class="checkbox">
                                <input type="checkbox" name="nuevo-usuario-servicio" value="INTERNET_BANDA_ANCHA" />
                                Internet de banda ancha
                            </label>
                            <label class="checkbox">
                                <input type="checkbox" name="nuevo-usuario-servicio" value="TELEVISION" />
                                Televisión
                            </label>
                        </div>
                    </div>

                    <button type="submit" style="margin-top: 20px;">Crear usuario</button>
                    <p class="error" id="error-crear-usuario" hidden></p>
                    <p class="exito" id="exito-crear-usuario" hidden></p>
                </form>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <h2 style="margin: 0;">Todos los usuarios</h2>
                <button class="secundario" id="boton-refrescar-usuarios">Refrescar</button>
            </div>
            <p class="error" id="error-usuarios" hidden></p>
            <div class="lista-tickets" id="lista-usuarios"></div>
        </section>
    </div>

    <!-- Modal de detalle -->
    <div class="superposicion" id="modal-detalle" hidden>
        <div class="tarjeta">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <h2 id="detalle-titulo" style="margin: 0;"></h2>
                <button class="secundario" id="boton-cerrar-modal" style="padding: 4px 12px;">✕</button>
            </div>
            <div id="detalle-cuerpo"></div>

            <div id="detalle-acciones" style="margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap;">
                <button id="boton-iniciar-analisis" hidden>Iniciar análisis</button>
                <button id="boton-iniciar-progreso" hidden>Iniciar progreso</button>
                <button class="secundario" id="boton-cancelar-ticket" hidden>Cancelar ticket</button>
                <button id="boton-confirmar-cierre" hidden>Confirmar cierre</button>
            </div>

            <div id="bloque-asignar-tecnico" hidden style="margin-top: 16px;">
                <label for="asignar-tecnico-select">Asignar técnico</label>
                <div style="display: flex; gap: 10px;">
                    <select id="asignar-tecnico-select" style="flex: 1;"></select>
                    <button type="button" id="boton-asignar-tecnico" style="white-space: nowrap;">Asignar</button>
                </div>
            </div>

            <div id="bloque-derivar" hidden style="margin-top: 16px;">
                <label for="derivar-tecnico-select">Derivar a otro técnico (interconsulta)</label>
                <div style="display: flex; gap: 10px;">
                    <select id="derivar-tecnico-select" style="flex: 1;"></select>
                    <button type="button" class="secundario" id="boton-derivar" style="white-space: nowrap;">Derivar</button>
                </div>
            </div>

            <div id="bloque-resolver" hidden style="margin-top: 16px;">
                <label for="resolver-nota">Nota de resolución técnica</label>
                <textarea id="resolver-nota" placeholder="Describí la solución aplicada…"></textarea>
                <button type="button" id="boton-resolver" style="margin-top: 10px;">Resolver ticket</button>
            </div>

            <p class="error" id="error-detalle" hidden></p>

            <div id="bloque-comentario" style="margin-top: 20px;">
                <label for="comentario-texto">Agregar comentario</label>
                <textarea id="comentario-texto" placeholder="Sumá información o seguimiento sobre este ticket…"></textarea>
                <button type="button" class="secundario" id="boton-comentar" style="margin-top: 10px;">Comentar</button>
            </div>

            <h2 style="margin-top: 20px;">Historial</h2>
            <div id="detalle-historial"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
