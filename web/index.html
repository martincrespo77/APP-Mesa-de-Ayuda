<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesa de Ayuda — Comunicarlos</title>
    <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
    <div class="contenedor" style="padding-top: 15vh;">
        <div class="tarjeta">
            <h1>Mesa de Ayuda</h1>
            <p class="subtitulo">Cooperativa Comunicarlos — Portal web</p>

            <form id="form-login">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="username" />

                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                />

                <button type="submit" style="width: 100%; margin-top: 20px;">Ingresar</button>
                <p class="error" id="error-login" hidden></p>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
